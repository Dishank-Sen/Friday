[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.1.0"
description = "Environment layer for controlling an Ubuntu desktop in Docker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.0.0",
  "httpx>=0.27.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "pillow>=10.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["fastapi>=0.115.0", "pytest>=8.0.0", "ruff>=0.6.0", "uvicorn>=0.30.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
friday = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires Docker and a locally built Friday image",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
